[project]
name = "github-pr-context-mcp"
version = "0.3.1"
description = "Hardened Pure Context Retrieval Engine for GitHub PR History"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Paarth Gala"}
]
dependencies = [
    "mcp>=1.27.2,<2.0",
    "chromadb==0.5.0",
    # Chroma 0.5 imports np.float_, which NumPy 2 removed.
    "numpy>=1.22.5,<2.0",
    "sentence-transformers==2.7.0",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
    "tenacity==8.2.3",
    "httpx>=0.27.1,<1.0",
    "starlette>=0.27",
    "keyring>=25.0,<26.0"
]

[project.optional-dependencies]
test = [
    "pytest==8.2.0",
]

[tool.pytest.ini_options]
# The suite lives in tests/. Without this, a bare `python -m pytest` collects
# from the repo root and picks up scratch/ helpers whose names happen to match
# pytest's default `*_test.py` pattern, failing at import.
testpaths = ["tests"]

[project.scripts]
github-pr-context-mcp = "entrypoints.local.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicitly discover all packages so uvx/pipx installs from git work correctly.
# Without this, setuptools may miss subpackages like app, auth, storage, etc.
where = ["."]  # search from repo root
include = [
    "app*",
    "auth*",
    "analytics*",
    "storage*",
    "fetcher*",
    "entrypoints*",
]

[tool.setuptools.data-files]
"share/github-pr-context-mcp/skills/github-pr-context-v3" = [
    ".agents/skills/github-pr-context-v3/SKILL.md",
]
"share/github-pr-context-mcp/skills/github-pr-context-v3/agents" = [
    ".agents/skills/github-pr-context-v3/agents/openai.yaml",
]
